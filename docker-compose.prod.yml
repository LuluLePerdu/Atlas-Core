# Docker Compose Production avec Traefik (SSL automatique)

version: '3.8'

services:
  # Traefik Reverse Proxy avec Let's Encrypt
  traefik:
    image: traefik:v2.10
    container_name: atlas-traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@ludwig-emmanuel.dev}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - atlas-network

  postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_core_prod}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas_core_prod}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 5000
      CORS_ORIGIN: https://${DOMAIN:-atlas.ludwig-emmanuel.dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atlas-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN:-api.ludwig-emmanuel.dev}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolalloworigin=https://${DOMAIN:-atlas.ludwig-emmanuel.dev}"
      - "traefik.http.routers.backend.middlewares=backend-cors"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: https://${API_DOMAIN:-api.ludwig-emmanuel.dev}
    container_name: atlas-frontend
    restart: always
    networks:
      - atlas-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-atlas.ludwig-emmanuel.dev}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:
    driver: local
  traefik-certificates:
    driver: local

networks:
  atlas-network:
    driver: bridge

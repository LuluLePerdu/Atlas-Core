version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: 10.50.0.11
      DB_PORT: 5432
      DB_NAME: atlas_core_prod
      DB_USER: atlas_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000
      CORS_ORIGIN: https://atlas.ludwig-emmanuel.dev,http://atlas.local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atlas-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: https://atlas.ludwig-emmanuel.dev/api
      VITE_API_URL_LOCAL: http://atlas.local/api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - atlas-network

  # Nginx Reverse Proxy (démarre en dernier)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: atlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge
